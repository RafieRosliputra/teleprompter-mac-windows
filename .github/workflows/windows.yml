# Builds the Windows app on a real Windows runner and attaches it to the release.
# Runs when a release is published, or by hand (Actions › Windows build › Run workflow).
name: Windows build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $dir = "JohorStudio Teleprompter"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/teleprompter-mac-windows.exe "$dir/JohorStudio Teleprompter.exe"
          Compress-Archive -Path $dir -DestinationPath JohorStudio-Teleprompter-windows-x64.zip -Force

      - name: Attach to the release
        shell: pwsh
        run: gh release upload "$env:TAG" JohorStudio-Teleprompter-windows-x64.zip --clobber --repo "${{ github.repository }}"
