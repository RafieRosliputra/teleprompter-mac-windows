[package]
name = "teleprompter-mac-windows"
version = "0.1.4"
edition = "2024"

[dependencies]
display-info = "0.5.10"
eframe = "0.37.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
lto = "thin"
strip = true
