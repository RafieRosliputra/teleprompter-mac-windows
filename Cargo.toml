[package]
name = "teleprompter-mac-windows"
version = "0.1.6"
edition = "2024"

[dependencies]
display-info = "0.5.10"
eframe = "0.37.0"
getrandom = "0.3"
if-addrs = "0.15.0"
qrcode = { version = "0.14.1", default-features = false }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
tungstenite = { version = "0.30", features = ["native-tls"] }
ureq = { version = "3.5.0", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
lto = "thin"
strip = true
