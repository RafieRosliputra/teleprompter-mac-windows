<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<title>JohorStudio Remote</title>
<style>
:root{--bg:#0d0d0f;--card:#17171b;--line:#2a2a31;--text:#f2f2f4;--mute:#9a9aa6;--acc:#f5c542;--red:#ff4040;--ok:#5ad08a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{touch-action:manipulation}
.app{min-height:100dvh;display:flex;flex-direction:column;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
button{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);cursor:pointer}
button:active{transform:scale(.96);filter:brightness(1.25)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.conn{display:flex;align-items:center;gap:8px;font-size:13px;color:#b8b8c2;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;background:#ff6b6b;flex-shrink:0}
.dot.on{background:var(--ok)}
.icons{display:flex;gap:8px}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.ib.lang{font-size:14px;font-weight:800;color:var(--text)}
.ib.on{border-color:var(--acc);background:#2a2412;color:var(--acc)}
.title{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.title b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title span{font-size:13px;color:var(--acc);font-weight:700}
.pv{position:relative;flex:none;height:clamp(200px,42vh,400px);background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none}
.pv canvas{position:absolute;inset:0;width:100%;height:100%}
.tag{position:absolute;bottom:8px;font-size:11px;padding:3px 8px;border-radius:999px;pointer-events:none}
.tag.l{left:10px;color:#c9c9d2;background:rgba(0,0,0,.7)}
.tag.r{right:10px;color:var(--text);background:rgba(23,23,27,.9);border:1px solid #3a3a42;display:flex;align-items:center;gap:5px}
.stat{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 16px}
.stat b{font-size:22px;font-weight:800}
.stat span{font-size:13px;color:var(--mute)}
.pad{display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.side{width:76px;height:76px;border-radius:22px;display:grid;place-items:center}
.play{width:118px;height:118px;border-radius:50%;border:0;background:var(--acc);color:#111;display:grid;place-items:center}
.lbl{font-size:12px;color:var(--mute);margin-bottom:6px}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.chips button{height:44px;border-radius:10px}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#111;font-weight:800}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grid4 button{height:62px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px}
.font{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 16px}
.font>span{font-size:14px;color:#b8b8c2}
.font div{display:flex;align-items:center;gap:6px}
.font button{width:44px;height:44px;border-radius:10px;background:#0f0f12;font-size:22px}
.font b{width:44px;text-align:center;font-size:18px}
.scripts{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.shead b{font-size:16px}
.shead div{display:flex;gap:6px}
.shead button{height:40px;padding:0 10px;border-radius:10px;background:#0f0f12;font-size:13px}
.slist{display:flex;flex-direction:column;gap:6px}
.sitem{width:100%;text-align:left;padding:10px 12px;border-radius:10px;background:#0f0f12;display:flex;flex-direction:column;gap:2px}
.sitem.on{border-color:var(--acc);background:#2a2412}
.sitem .r1{display:flex;gap:8px;align-items:baseline}
.sitem .c{color:var(--acc);font-weight:800;font-size:14px}
.sitem .tt{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem .sub{font-size:12px;color:var(--mute)}
.sitem .now{font-size:11px;color:#111;background:var(--acc);border-radius:999px;padding:1px 7px;margin-left:auto;font-weight:700}
.sempty{font-size:13px;color:var(--mute);padding:6px 2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#26262c;border:1px solid #3a3a42;color:var(--text);padding:10px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
video{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="conn"><span class="dot" id="dot"></span><span id="conn">Connecting…</span></div>
    <div class="icons">
      <button class="ib lang" id="lang" data-ia="aLang" aria-label="Language">EN</button>
      <button class="ib" id="wake" data-ia="aWake" aria-label="Keep the phone screen on">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="ib" id="fs" data-ia="aFs" aria-label="Fullscreen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </div>

  <div class="title"><b id="title">Teleprompter</b><span id="code"></span></div>

  <div class="pv" id="pv">
    <canvas id="cv"></canvas>
    <div class="tag l" data-i="screen2">Screen 2</div>
    <div class="tag r"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M7 8l5-5 5 5M7 16l5 5 5-5"/></svg><span data-i="hint">Drag up/down · tap a line</span></div>
  </div>

  <div class="stat"><b id="state">⏹ Stopped</b><span id="line">Line – / –</span></div>

  <div class="pad">
    <button class="side" data-cmd="slower" data-ia="aSlower" aria-label="Slower or reverse">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
    </button>
    <button class="play" data-cmd="toggle" id="play" data-ia="aPlay" aria-label="Play or pause">
      <svg id="icoPlay" width="46" height="46" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
      <svg id="icoPause" width="46" height="46" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
    <button class="side" data-cmd="faster" data-ia="aFaster" aria-label="Faster">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg>
    </button>
  </div>

  <div>
    <div class="lbl" data-i="defSpeed">Speed when you press Play</div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="grid4">
    <button data-cmd="line_up"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg><span data-i="line1">Line</span></button>
    <button data-cmd="line_down"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg><span data-i="line1">Line</span></button>
    <button data-cmd="top"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14M12 20V9M7 14l5-5 5 5"/></svg><span data-i="top">Top</span></button>
    <button data-cmd="stop"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span data-i="stop">Stop</span></button>
  </div>

  <div class="font">
    <span data-i="font">Screen 2 font size</span>
    <div>
      <button id="fminus" data-ia="aFminus" aria-label="Smaller Screen 2 text">−</button>
      <b id="fsz">–</b>
      <button id="fplus" data-ia="aFplus" aria-label="Larger Screen 2 text">+</button>
    </div>
  </div>

  <div class="scripts">
    <div class="shead">
      <b data-i="scripts">Scripts</b>
      <div>
        <button id="sreload" data-i="reloadBtn" data-ia="aReload" aria-label="Reload the current script from the server">⟳ Reload script</button>
        <button id="slistbtn" data-i="listBtn" data-ia="aList" aria-label="Refresh the script list">⟳ List</button>
      </div>
    </div>
    <div class="slist" id="slist"><div class="sempty" data-i="loadingList">Loading the script list…</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<video id="ns" playsinline muted loop src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAANcbW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAAC7gAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAod0cmFrAAAAXHRraGQAAAADAAAAAAAAAAAAAAABAAAAAAAAC7gAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAABAAAAAQAAAAAAAkZWR0cwAAABxlbHN0AAAAAAAAAAEAAAu4AACAAAABAAAAAAH/bWRpYQAAACBtZGhkAAAAAAAAAAAAAAAAAABAAAAAwABVxAAAAAAALWhkbHIAAAAAAAAAAHZpZGUAAAAAAAAAAAAAAABWaWRlb0hhbmRsZXIAAAABqm1pbmYAAAAUdm1oZAAAAAEAAAAAAAAAAAAAACRkaW5mAAAAHGRyZWYAAAAAAAAAAQAAAAx1cmwgAAAAAQAAAWpzdGJsAAAAvnN0c2QAAAAAAAAAAQAAAK5hdmMxAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAABAAEABIAAAASAAAAAAAAAABFExhdmM2My4xLjEwMiBsaWJ4MjY0AAAAAAAAAAAAAAAAGP//AAAANGF2Y0MBZAAK/+EAF2dkAAqs2V7ARAAAAwAEAAADAAg8SJZYAQAGaOvjxMhM/fj4AAAAABBwYXNwAAAAAQAAAAEAAAAUYnRydAAAAAAAAAewAAAAAAAAABhzdHRzAAAAAAAAAAEAAAADAABAAAAAABRzdHNzAAAAAAAAAAEAAAABAAAAKGN0dHMAAAAAAAAAAwAAAAEAAIAAAAAAAQAAwAAAAAABAABAAAAAABxzdHNjAAAAAAAAAAEAAAABAAAAAwAAAAEAAAAgc3RzegAAAAAAAAAAAAAAAwAAAsgAAAANAAAADQAAABRzdGNvAAAAAAAAAAEAAAOMAAAAYXVkdGEAAABZbWV0YQAAAAAAAAAhaGRscgAAAAAAAAAAbWRpcmFwcGwAAAAAAAAAAAAAAAAsaWxzdAAAACSpdG9vAAAAHGRhdGEAAAABAAAAAExhdmY2My4xLjEwMgAAAAhmcmVlAAAC6m1kYXQAAAKvBgX//6vcRem95tlIt5Ys2CDZI+7veDI2NCAtIGNvcmUgMTY1IHIzMjIyIGIzNTYwNWEgLSBILjI2NC9NUEVHLTQgQVZDIGNvZGVjIC0gQ29weWxlZnQgMjAwMy0yMDI1IC0gaHR0cDovL3d3dy52aWRlb2xhbi5vcmcveDI2NC5odG1sIC0gb3B0aW9uczogY2FiYWM9MSByZWY9MyBkZWJsb2NrPTE6LTM6LTMgYW5hbHlzZT0weDM6MHgxMTMgbWU9aGV4IHN1Ym1lPTcgcHN5PTEgcHN5X3JkPTIuMDA6MC43MCBtaXhlZF9yZWY9MSBtZV9yYW5nZT0xNiBjaHJvbWFfbWU9MSB0cmVsbGlzPTEgOHg4ZGN0PTEgY3FtPTAgZGVhZHpvbmU9MjEsMTEgZmFzdF9wc2tpcD0xIGNocm9tYV9xcF9vZmZzZXQ9LTQgdGhyZWFkcz0xIGxvb2thaGVhZF90aHJlYWRzPTEgc2xpY2VkX3RocmVhZHM9MCBucj0wIGRlY2ltYXRlPTEgaW50ZXJsYWNlZD0wIGJsdXJheV9jb21wYXQ9MCBjb25zdHJhaW5lZF9pbnRyYT0wIGJmcmFtZXM9MyBiX3B5cmFtaWQ9MiBiX2FkYXB0PTEgYl9iaWFzPTAgZGlyZWN0PTEgd2VpZ2h0Yj0xIG9wZW5fZ29wPTAgd2VpZ2h0cD0yIGtleWludD0 <script>
const $ = id => document.getElementById(id);
let ws = null, st = null, layout = null, layoutVer = -1;
let dispY = null, dragging = false, holdUntil = 0;
const cv = $("cv"), ctx2 = cv.getContext("2d"), pv = $("pv");

function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("show"), 2600); }
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
function buzz() { if (navigator.vibrate) navigator.vibrate(8); }

// ---------- language (EN default, BM optional; saved on this phone)
const I18N = {
  en: {
    connecting: "Connecting…", waiting: "Waiting for the Mac · {0}", reconnect: "Disconnected — reconnecting…",
    connected: "Connected · Mac · {0}", macOff: "The Mac is offline", internet: "Internet", local: "Local",
    screen2: "Screen 2", hint: "Drag up/down · tap a line", paused: "⏸ Paused", stopped: "⏹ Stopped",
    speed: "▶ Speed {0}x", reverse: "◀ Reverse {0}x", line: "Line {0} / {1}", defSpeed: "Speed when you press Play",
    line1: "Line", top: "Top", stop: "Stop", font: "Screen 2 font size", scripts: "Scripts",
    reloadBtn: "⟳ Reload script", listBtn: "⟳ List", loadingList: "Loading the script list…",
    noScripts: "No scripts on the server.", showing: "Showing", chars: "chars",
    minAgo: "{0} min ago", hAgo: "{0} h ago", dAgo: "{0} days ago",
    isShowing: "This script is already on screen", confirmLoad: "Load script {0} — {1}?\nThe script on screen now will be replaced.",
    loading: "Loading the script…", listLoading: "Loading the list…", notServer: "The current script isn't from the server",
    reloading: "Reloading the script (position kept)…", wakeFail: "Couldn't keep the screen on. Tap again.",
    wakeOn: "The screen will stay on", wakeOff: "The screen can sleep as usual", fsFail: "The browser blocked fullscreen",
    iosFs: "iPhone: Share › Add to Home Screen for fullscreen",
    aLang: "Language: English (tap for Bahasa Melayu)", aWake: "Keep the phone screen on", aFs: "Fullscreen",
    aSlower: "Slower or reverse", aPlay: "Play or pause", aFaster: "Faster", aFminus: "Smaller Screen 2 text",
    aFplus: "Larger Screen 2 text", aReload: "Reload the current script from the server", aList: "Refresh the script list",
  },
  ms: {
    connecting: "Menyambung…", waiting: "Menunggu Mac · {0}", reconnect: "Terputus — menyambung semula…",
    connected: "Bersambung · Mac · {0}", macOff: "Mac tidak dalam talian", internet: "Internet", local: "Tempatan",
    screen2: "Skrin 2", hint: "Leret atas/bawah · ketik baris", paused: "⏸ Berhenti", stopped: "⏹ Diam",
    speed: "▶ Laju {0}x", reverse: "◀ Undur {0}x", line: "Baris {0} / {1}", defSpeed: "Laju bila tekan Main",
    line1: "Baris", top: "Atas", stop: "Stop", font: "Saiz huruf Skrin 2", scripts: "Skrip",
    reloadBtn: "⟳ Muat semula skrip", listBtn: "⟳ Senarai", loadingList: "Memuat senarai skrip…",
    noScripts: "Tiada skrip di server.", showing: "Dipapar", chars: "aksara",
    minAgo: "{0} min lalu", hAgo: "{0} jam lalu", dAgo: "{0} hari lalu",
    isShowing: "Skrip ini sedang dipapar", confirmLoad: "Muat skrip {0} — {1}?\nSkrip di skrin sekarang akan diganti.",
    loading: "Memuat skrip…", listLoading: "Memuat senarai…", notServer: "Skrip semasa bukan dari server",
    reloading: "Memuat semula skrip (posisi kekal)…", wakeFail: "Tak dapat kunci skrin. Ketik sekali lagi.",
    wakeOn: "Skrin akan kekal hidup", wakeOff: "Skrin boleh tidur seperti biasa", fsFail: "Skrin penuh tak dibenarkan oleh browser",
    iosFs: "iPhone: Share › Add to Home Screen untuk skrin penuh",
    aLang: "Bahasa: Bahasa Melayu (ketik untuk English)", aWake: "Skrin telefon sentiasa hidup", aFs: "Skrin penuh",
    aSlower: "Perlahan atau undur", aPlay: "Main atau henti", aFaster: "Laju", aFminus: "Kecilkan huruf Skrin 2",
    aFplus: "Besarkan huruf Skrin 2", aReload: "Muat semula skrip semasa dari server", aList: "Muat semula senarai skrip",
  },
};
let lang = "en";
try { lang = localStorage.getItem("tele-lang") || "en"; } catch (e) {}
if (!I18N[lang]) lang = "en";
function L(k, ...a) { return (I18N[lang][k] ?? I18N.en[k] ?? k).replace(/\{(\d)\}/g, (_, i) => a[i]); }
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(e => { e.textContent = L(e.dataset.i); });
  document.querySelectorAll("[data-ia]").forEach(e => e.setAttribute("aria-label", L(e.dataset.ia)));
  $("lang").textContent = lang === "ms" ? "BM" : "EN";
  updConn(); render();
  if (scripts) renderScripts();
}
$("lang").onclick = () => {
  lang = lang === "en" ? "ms" : "en";
  try { localStorage.setItem("tele-lang", lang); } catch (e) {}
  buzz(); applyLang();
};

// ---------- connection
// Internet (relay): page at https://tele.johorstudio.com/r/<session>
// Local: page at http://<mac-ip>:8140/ (Tailscale / same Wi-Fi)
const relayId = (location.pathname.match(/^\/r\/([a-z0-9]{16,64})$/) || [])[1];
const wsUrl = relayId
  ? `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/relay/phone/${relayId}`
  : `ws://${location.hostname}:8141/`;
let lastMsg = 0, scripts = null, askedList = false, conn = "connecting";
function updConn() {
  const via = L(relayId ? "internet" : "local");
  $("dot").classList.toggle("on", conn === "connected");
  $("conn").textContent = L(conn, via);
}
function connect() {
  ws = new WebSocket(wsUrl);
  ws.onopen = () => { conn = "waiting"; updConn(); };
  ws.onclose = () => { conn = "reconnect"; updConn(); setTimeout(connect, 1500); };
  ws.onerror = () => ws.close();
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    lastMsg = performance.now();
    if (m.t === "layout") { layout = m; layoutVer = m.ver; return; }
    if (m.t === "mac") { conn = m.on ? "connected" : "macOff"; updConn(); return; }
    if (m.t === "scripts") { scripts = m; renderScripts(); return; }
    if (m.t === "state") {
      if (!askedList) { askedList = true; send({cmd: "list_scripts"}); }
      st = m;
      if (conn !== "connected") { conn = "connected"; updConn(); }
      render();
    }
  };
}
setInterval(() => send({t: "ping"}), 20000);

// ---------- UI state
function render() {
  if (!st) return;
  const s = st.paused ? L("paused") : st.spd === 0 ? L("stopped") : st.spd > 0 ? L("speed", st.spd) : L("reverse", -st.spd);
  $("state").textContent = s;
  $("line").textContent = L("line", st.row, st.rows);
  $("fsz").textContent = Math.round(st.fs);
  const t = st.title || "Teleprompter", m = t.match(/^(\d{6}) — (.*)$/);
  $("title").textContent = m ? m[2] : t;
  $("code").textContent = m ? m[1] : "";
  const run = !st.paused && st.spd !== 0;
  $("icoPlay").style.display = run ? "none" : "";
  $("icoPause").style.display = run ? "" : "none";
  [...$("chips").children].forEach(b => b.classList.toggle("on", +b.dataset.v === st.def));
  if (scripts && renderScripts.code !== st.code) renderScripts();
}

// ---------- script list (fetched by the Mac from tele.johorstudio.com)
function ago(t) {
  const d = Math.max(0, Date.now() / 1000 - t);
  return d < 3600 ? L("minAgo", Math.floor(d / 60)) : d < 86400 ? L("hAgo", Math.floor(d / 3600)) : L("dAgo", Math.floor(d / 86400));
}
function renderScripts() {
  const box = $("slist"), cur = st && st.code;
  renderScripts.code = cur;
  box.textContent = "";
  if (scripts.error) {
    const e = document.createElement("div"); e.className = "sempty"; e.textContent = "⚠ " + scripts.error; box.appendChild(e);
  }
  if (!scripts.items.length && !scripts.error) {
    const e = document.createElement("div"); e.className = "sempty"; e.textContent = L("noScripts"); box.appendChild(e);
  }
  for (const it of scripts.items) {
    const b = document.createElement("button");
    b.className = "sitem" + (it.code === cur ? " on" : "");
    const r1 = document.createElement("div"); r1.className = "r1";
    const c = document.createElement("span"); c.className = "c"; c.textContent = it.code;
    const tt = document.createElement("span"); tt.className = "tt"; tt.textContent = it.title;
    r1.append(c, tt);
    if (it.code === cur) { const n = document.createElement("span"); n.className = "now"; n.textContent = L("showing"); r1.appendChild(n); }
    const sub = document.createElement("div"); sub.className = "sub";
    sub.textContent = `${it.name} · ${it.chars} ${L("chars")} · ${ago(it.updated)}`;
    b.append(r1, sub);
    b.onclick = () => {
      if (it.code === cur) { toast(L("isShowing")); return; }
      if (!confirm(L("confirmLoad", it.code, it.title))) return;
      buzz(); send({cmd: "load_script", code: it.code}); toast(L("loading"));
    };
    box.appendChild(b);
  }
}
$("slistbtn").onclick = () => { buzz(); send({cmd: "list_scripts"}); toast(L("listLoading")); };
$("sreload").onclick = () => {
  buzz();
  if (!st || !st.code) { toast(L("notServer")); return; }
  send({cmd: "reload_script"}); toast(L("reloading"));
};
for (const v of [6, 10, 16, 20]) {
  const b = document.createElement("button");
  b.textContent = v + "x"; b.dataset.v = v;
  b.onclick = () => { buzz(); send({cmd: "default_speed", v}); };
  $("chips").appendChild(b);
}
document.querySelectorAll("[data-cmd]").forEach(b => b.addEventListener("click", () => { buzz(); send({cmd: b.dataset.cmd}); }));
$("fminus").onclick = () => { buzz(); send({cmd: "font", delta: -4}); };
$("fplus").onclick = () => { buzz(); send({cmd: "font", delta: 4}); };

// ---------- preview (same rows as screen 2)
function draw() {
  requestAnimationFrame(draw);
  const r = pv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(r.width * dpr) || cv.height !== Math.round(r.height * dpr)) {
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  }
  const c = ctx2; c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.fillStyle = "#000"; c.fillRect(0, 0, r.width, r.height);
  if (!layout || !st) return;
  const L = layout, scale = r.width / L.w, readY = r.height * L.read;
  if (dispY === null) dispY = st.y;
  if (!dragging && performance.now() > holdUntil) {
    const k = Math.min(1, 0.25 + Math.abs(st.y - dispY) / 400);
    dispY += (st.y - dispY) * k;
  }
  const left = r.width * L.ml, right = r.width * (1 - L.mr);
  const fs = L.fs * scale;
  c.font = `bold ${fs}px Arial, "Helvetica Neue", Helvetica, sans-serif`;
  c.textBaseline = "middle";
  for (const row of L.rows) {
    const y = readY + (row.y + row.h / 2 - dispY) * scale;
    if (y < -fs || y > r.height + fs) continue;
    let width = 0;
    for (const [t] of row.s) width += c.measureText(t).width;
    let x = L.align === "center" ? (left + right - width) / 2 : L.align === "right" ? right - width : left;
    for (const [t, col] of row.s) { c.fillStyle = col; c.fillText(t, x, y); x += c.measureText(t).width; }
  }
  const a = Math.max(7, 40 * scale * 0.35);
  c.fillStyle = "#ff4040";
  c.beginPath(); c.moveTo(6, readY - a); c.lineTo(6 + a * 1.2, readY); c.lineTo(6, readY + a); c.fill();
  c.beginPath(); c.moveTo(r.width - 6, readY - a); c.lineTo(r.width - 6 - a * 1.2, readY); c.lineTo(r.width - 6, readY + a); c.fill();
}
requestAnimationFrame(draw);

// drag to scroll, tap to jump
let start = null, sent = 0;
pv.addEventListener("pointerdown", e => {
  if (!layout || !st) return;
  pv.setPointerCapture(e.pointerId);
  start = {y: e.clientY, t: performance.now(), scroll: dispY ?? st.y, moved: false};
});
pv.addEventListener("pointermove", e => {
  if (!start) return;
  const dy = e.clientY - start.y;
  if (Math.abs(dy) > 6) start.moved = true;
  if (!start.moved) return;
  dragging = true;
  const scale = pv.getBoundingClientRect().width / layout.w;
  dispY = start.scroll - dy / scale;
  const now = performance.now();
  if (now - sent > 30) { sent = now; send({cmd: "scroll_to", y: dispY}); }
});
function endDrag(e) {
  if (!start) return;
  const r = pv.getBoundingClientRect(), scale = r.width / layout.w;
  if (!start.moved && performance.now() - start.t < 400) {
    const y = (dispY ?? st.y) + (e.clientY - r.top - r.height * layout.read) / scale;
    buzz(); send({cmd: "jump", y});
  } else if (dragging) {
    send({cmd: "scroll_to", y: dispY});
    holdUntil = performance.now() + 250;
  }
  start = null; dragging = false;
}
pv.addEventListener("pointerup", endDrag);
pv.addEventListener("pointercancel", endDrag);

// ---------- keep screen awake
let wakeOn = false, lock = null;
async function setWake(on) {
  wakeOn = on; $("wake").classList.toggle("on", on);
  const v = $("ns");
  if (!on) { if (lock) { lock.release(); lock = null; } v.pause(); return; }
  try {
    if ("wakeLock" in navigator && window.isSecureContext) { lock = await navigator.wakeLock.request("screen"); return; }
  } catch (e) {}
  try { await v.play(); } catch (e) { toast(L("wakeFail")); wakeOn = false; $("wake").classList.remove("on"); }
}
$("wake").onclick = () => { buzz(); setWake(!wakeOn); toast(L(wakeOn ? "wakeOn" : "wakeOff")); };
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && wakeOn) setWake(true); });

// ---------- fullscreen
$("fs").onclick = async () => {
  buzz();
  const d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (req) { try { await req.call(el); } catch (e) { toast(L("fsFail")); } }
  else toast(L("iosFs"));
  if (!wakeOn) setWake(true);
};
document.addEventListener("fullscreenchange", () => $("fs").classList.toggle("on", !!document.fullscreenElement));

applyLang();
connect();
</script>
